<!DOCTYPE html>
<html>
  <head>
    <title>Girl Safety App</title>
    <link rel="stylesheet"
      href="style.css">
  </head>
  <body>
    <h1>Girl Safety App</h1>
    <button onclick="showAlert()">SOS</button>
    <script>
      function showAlert() {
        navigator.geolocation.getCurrentPosition(function(position){
          alert("Latitude: " +
                position.coords.latitude +
                "\nLongitude: " +
                position.coords.longitude
                );
        });
      }
    </script>
  </body>
</html>
