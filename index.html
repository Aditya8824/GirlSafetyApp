<!DOCTYPE html>
<html>
  <head>
    <title>Girl Safety App</title>
    <link rel="stylesheet"
      href="style.css">
  </head>
  <body>
    <h1>Girl Safety App</h1>
    <button onclick="showAlert()">SOS</button>
    <script>
      function showAlert() {
        navigator.geolocation.getCurrentPosition(function(position){
          let lat =
            position.coords.latitude;
          let lon =
            position.coords.longitude;
          window.open(
            "https://wa.me/917075845697?text=
            Help! My location:
          https://www.google.com/maps?q=" +
            lat + "," + lon
            );
      }
    </script>
  </body>
</html>
